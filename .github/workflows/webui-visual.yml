name: BRENE Chromium WebUI QA
on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise mobile and desktop layouts
        run: node tests/visual-webui.mjs
      - name: Upload UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRENE-WebUI-visual-QA
          path: webui-screenshots/*.png
          if-no-files-found: ignore
